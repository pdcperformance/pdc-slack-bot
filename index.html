<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDC Ad Performance</title>
<meta name="description" content="Reel A vs Reel B daily add-to-carts and cost per cart, updated automatically.">
<style>
  :root{
    --bg:#fbfbf9; --surface:#ffffff; --ink:#1a1d21; --ink-2:#565b62; --muted:#8a9099;
    --grid:#ededea; --border:#e7e7e3; --a:#2a78d6; --b:#e8621a; --shadow:0 1px 3px rgba(20,22,26,.06),0 8px 24px rgba(20,22,26,.05);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1113; --surface:#171a1e; --ink:#eef0f2; --ink-2:#a9afb7; --muted:#727880;
    --grid:#24282d; --border:#2a2f35; --a:#5aa0f2; --b:#f5883f; --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1113; --surface:#171a1e; --ink:#eef0f2; --ink-2:#a9afb7; --muted:#727880;
    --grid:#24282d; --border:#2a2f35; --a:#5aa0f2; --b:#f5883f; --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:32px 16px 64px}
  header{margin-bottom:24px}
  .eyebrow{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
  h1{font-size:clamp(24px,4vw,34px); margin:.15em 0 .1em; letter-spacing:-.02em; text-wrap:balance}
  .sub{color:var(--ink-2); font-size:15px; margin:0}
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 4px; font-size:13.5px; color:var(--ink-2)}
  .legend .key{display:inline-flex; align-items:center; gap:7px}
  .legend .swatch{width:22px; height:3px; border-radius:2px; display:inline-block}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:22px 0 30px}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px; color:var(--muted); font-weight:600}
  .kpi .val{font-size:26px; font-weight:650; margin-top:3px; letter-spacing:-.01em}
  .kpi .note{font-size:12px; color:var(--ink-2); margin-top:3px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 16px 10px; box-shadow:var(--shadow); margin-bottom:26px}
  .card h2{font-size:16px; margin:0 0 2px; letter-spacing:-.01em}
  .card .cap{font-size:13px; color:var(--muted); margin:0 0 6px}
  .chart{position:relative; width:100%}
  svg{display:block; width:100%; height:auto; overflow:visible}
  .grid line{stroke:var(--grid); stroke-width:1}
  .axis text{fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  .switch line{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; opacity:.65}
  .switch text{fill:var(--muted); font-size:10.5px; font-weight:600}
  .serie{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  .endlabel{font-size:12px; font-weight:650; font-variant-numeric:tabular-nums}
  .dot-ring{fill:var(--surface)}
  .hover-line{stroke:var(--ink-2); stroke-width:1; opacity:.35}
  .tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
       border-radius:9px; box-shadow:var(--shadow); padding:8px 10px; font-size:12.5px; min-width:132px;
       transform:translate(-50%,-115%); opacity:0; transition:opacity .08s; z-index:5}
  .tip .d{color:var(--muted); font-weight:600; margin-bottom:5px; font-size:11.5px}
  .tip .r{display:flex; align-items:center; justify-content:space-between; gap:14px; font-variant-numeric:tabular-nums}
  .tip .r .k{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2)}
  .tip .r .k i{width:9px; height:9px; border-radius:50%; display:inline-block}
  .tip .r .v{font-weight:650; color:var(--ink)}
  details{margin-top:8px; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:var(--shadow)}
  summary{cursor:pointer; padding:13px 16px; font-weight:600; font-size:14px; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"▸"; float:right; color:var(--muted); transition:transform .15s}
  details[open] summary::after{transform:rotate(90deg)}
  .tbl-scroll{overflow-x:auto; padding:0 4px 8px}
  table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
  th,td{text-align:right; padding:7px 12px; border-bottom:1px solid var(--border); white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--surface)}
  tr.switch-row td{border-top:2px solid color-mix(in srgb,var(--b) 55%,transparent)}
  footer{color:var(--muted); font-size:12.5px; margin-top:8px; text-align:center}
  .status{display:inline-flex; align-items:center; gap:6px}
  .status i{width:7px;height:7px;border-radius:50%;background:#2fa96b;display:inline-block}
  .err{color:var(--b); font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">PDC Performance · Meta ads</div>
    <h1>Reel A vs Reel B</h1>
    <p class="sub">Daily add-to-carts and cost per add-to-cart. Updates itself every morning.</p>
    <div class="legend">
      <span class="key"><span class="swatch" style="background:var(--a)"></span>Reel A · device reel</span>
      <span class="key"><span class="swatch" style="background:var(--b)"></span>Reel B · carousel <span style="color:var(--muted)">(from Sep 14)</span></span>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>Add-to-carts per day</h2>
    <p class="cap">Higher is better.</p>
    <div class="chart" id="chart-carts"></div>
  </div>

  <div class="card">
    <h2>Cost per add-to-cart</h2>
    <p class="cap">Lower is better. Gaps = no carts that day.</p>
    <div class="chart" id="chart-cpc"></div>
  </div>

  <details>
    <summary>See the numbers</summary>
    <div class="tbl-scroll"><table id="tbl"></table></div>
  </details>

  <footer id="foot"></footer>
</div>

<script>
const A="#colorA", B="#colorB";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtMoney = v => v==null? "—" : "$"+v.toFixed(2);
const fmtDate = s => { const [y,m,d]=s.split("-"); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const SWITCH_DATE="2026-09-14";

function cpc(carts,spend){ return carts>0 ? spend/carts : null; }

function drawChart(el, data, accessor, {money=false}={}){
  const W=920,H=340, m={t:18,r:54,b:34,l:48};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const n=data.length;
  const xs = i => m.l + (n<=1?iw/2:(iw*i/(n-1)));
  const aVals=data.map(d=>accessor(d,"a")), bVals=data.map(d=>accessor(d,"b"));
  const allV=aVals.concat(bVals).filter(v=>v!=null);
  let maxV=Math.max(1,...allV);
  // round up nicely
  const step = money ? (maxV>10?2:1) : (maxV>12?4:2);
  maxV = Math.ceil(maxV/step)*step;
  const ys = v => m.t + ih - (v/maxV)*ih;

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("role","img");

  const NS="http://www.w3.org/2000/svg";
  const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

  // gridlines + y ticks
  const g=mk("g",{class:"grid"});
  const ax=mk("g",{class:"axis"});
  const ticks=[];
  for(let v=0; v<=maxV+1e-9; v+=step) ticks.push(v);
  ticks.forEach(v=>{
    const y=ys(v);
    g.appendChild(mk("line",{x1:m.l,y1:y,x2:W-m.r,y2:y}));
    const tx=mk("text",{x:m.l-8,y:y+3.5,"text-anchor":"end"}); tx.textContent = money? "$"+v : v; ax.appendChild(tx);
  });
  svg.appendChild(g);

  // x ticks (sparse)
  const everyX = Math.ceil(n/7);
  data.forEach((d,i)=>{ if(i%everyX===0 || i===n-1){
    const tx=mk("text",{x:xs(i),y:H-m.b+16,"text-anchor":"middle"}); tx.textContent=fmtDate(d.date); ax.appendChild(tx);
  }});
  svg.appendChild(ax);

  // switch marker
  const si=data.findIndex(d=>d.date===SWITCH_DATE);
  if(si>=0){
    const sg=mk("g",{class:"switch"}); const x=xs(si);
    sg.appendChild(mk("line",{x1:x,y1:m.t,x2:x,y2:m.t+ih}));
    const st=mk("text",{x:x+4,y:m.t+10}); st.textContent="B → carousel"; sg.appendChild(st);
    svg.appendChild(sg);
  }

  // series paths
  function pathFor(vals,color){
    let dstr="", started=false;
    vals.forEach((v,i)=>{ if(v==null){started=false;return;} dstr += (started?"L":"M")+xs(i)+" "+ys(v)+" "; started=true; });
    svg.appendChild(mk("path",{class:"serie",d:dstr,stroke:color}));
  }
  pathFor(aVals,cssVar("--a"));
  pathFor(bVals,cssVar("--b"));

  // end dots + labels
  function endMark(vals,color,label){
    for(let i=vals.length-1;i>=0;i--){ if(vals[i]!=null){
      const x=xs(i),y=ys(vals[i]);
      svg.appendChild(mk("circle",{class:"dot-ring",cx:x,cy:y,r:6.5}));
      svg.appendChild(mk("circle",{cx:x,cy:y,r:4,fill:color}));
      const t=mk("text",{class:"endlabel",x:x+9,y:y+4,fill:color});
      t.textContent = money? "$"+vals[i].toFixed(2) : vals[i];
      svg.appendChild(t);
      break;
    }}
  }
  endMark(aVals,cssVar("--a"));
  endMark(bVals,cssVar("--b"));

  // hover overlay
  const hover=mk("line",{class:"hover-line",x1:0,y1:m.t,x2:0,y2:m.t+ih,style:"opacity:0"});
  svg.appendChild(hover);
  const dotsHi=mk("g"); svg.appendChild(dotsHi);
  const overlay=mk("rect",{x:m.l,y:m.t,width:iw,height:ih,fill:"transparent"});
  svg.appendChild(overlay);
  el.appendChild(svg);

  const tip=document.createElement("div"); tip.className="tip"; el.appendChild(tip);

  function idxFromEvent(ev){
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let best=0,bd=1e9;
    for(let i=0;i<n;i++){const d=Math.abs(xs(i)-px); if(d<bd){bd=d;best=i;}}
    return best;
  }
  function show(ev){
    const i=idxFromEvent(ev); const d=data[i]; const x=xs(i);
    hover.setAttribute("x1",x); hover.setAttribute("x2",x); hover.style.opacity=1;
    dotsHi.innerHTML="";
    [["a",cssVar("--a")],["b",cssVar("--b")]].forEach(([k,c])=>{
      const v=accessor(d,k); if(v==null)return;
      dotsHi.appendChild(mk("circle",{class:"dot-ring",cx:x,cy:ys(v),r:6.5}));
      dotsHi.appendChild(mk("circle",{cx:x,cy:ys(v),r:4,fill:c}));
    });
    const av=accessor(d,"a"), bv=accessor(d,"b");
    const fmt=v=> v==null?"—":(money?"$"+v.toFixed(2):v);
    tip.innerHTML=`<div class="d">${fmtDate(d.date)}</div>`+
      `<div class="r"><span class="k"><i style="background:${cssVar("--a")}"></i>Reel A</span><span class="v">${fmt(av)}</span></div>`+
      `<div class="r"><span class="k"><i style="background:${cssVar("--b")}"></i>Reel B</span><span class="v">${fmt(bv)}</span></div>`;
    const r=svg.getBoundingClientRect();
    tip.style.left=(x/W*r.width)+"px";
    const topv=Math.min(av==null?1e9:ys(av), bv==null?1e9:ys(bv));
    tip.style.top=((isFinite(topv)?topv:m.t)/H*r.height)+"px";
    tip.style.opacity=1;
  }
  overlay.addEventListener("mousemove",show);
  overlay.addEventListener("mouseleave",()=>{tip.style.opacity=0;hover.style.opacity=0;dotsHi.innerHTML="";});
  // touch
  overlay.addEventListener("touchstart",e=>{show(e.touches[0]);},{passive:true});
  overlay.addEventListener("touchmove",e=>{show(e.touches[0]);},{passive:true});
}

function renderKPIs(data){
  const last=data[data.length-1];
  const la=cpc(last.a_carts,last.a_spend), lb=cpc(last.b_carts,last.b_spend);
  const rec=data.slice(-7);
  const avg=(k)=>{const xs=rec.map(d=>cpc(d[k+"_carts"],d[k+"_spend"])).filter(v=>v!=null); return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;};
  const a7=avg("a"), b7=avg("b");
  const cheaper = (a7!=null&&b7!=null) ? (a7<b7?"Reel A":"Reel B") : "—";
  const el=document.getElementById("kpis");
  const tile=(lbl,val,note)=>`<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="note">${note||""}</div></div>`;
  el.innerHTML =
    tile("Reel A · cost/cart (7-day)", fmtMoney(a7), "latest "+fmtMoney(la)) +
    tile("Reel B · cost/cart (7-day)", fmtMoney(b7), "latest "+fmtMoney(lb)) +
    tile("Cheaper per cart (7-day)", cheaper, a7!=null&&b7!=null?fmtMoney(Math.min(a7,b7))+" vs "+fmtMoney(Math.max(a7,b7)):"") +
    tile("Days tracked", data.length, data[0].date.slice(5)+" → "+last.date.slice(5));
}

function renderTable(data){
  const t=document.getElementById("tbl");
  let h="<thead><tr><th>Date</th><th>A carts</th><th>A $/cart</th><th>A spend</th><th>B carts</th><th>B $/cart</th><th>B spend</th></tr></thead><tbody>";
  data.slice().reverse().forEach(d=>{
    const cls = d.date===SWITCH_DATE ? ' class="switch-row"' : '';
    h+=`<tr${cls}><td>${fmtDate(d.date)}</td><td>${d.a_carts}</td><td>${fmtMoney(cpc(d.a_carts,d.a_spend))}</td><td>${fmtMoney(d.a_spend)}</td><td>${d.b_carts}</td><td>${fmtMoney(cpc(d.b_carts,d.b_spend))}</td><td>${fmtMoney(d.b_spend)}</td></tr>`;
  });
  t.innerHTML=h+"</tbody>";
}

fetch("data.json",{cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{
    data.sort((a,b)=>a.date<b.date?-1:1);
    renderKPIs(data);
    drawChart(document.getElementById("chart-carts"), data, (d,k)=>d[k+"_carts"], {money:false});
    drawChart(document.getElementById("chart-cpc"), data, (d,k)=>cpc(d[k+"_carts"],d[k+"_spend"]), {money:true});
    renderTable(data);
    const last=data[data.length-1].date;
    document.getElementById("foot").innerHTML=
      `<span class="status"><i></i>Live · last data point ${fmtDate(last)} · refreshes automatically each morning</span>`;
  })
  .catch(e=>{
    document.getElementById("foot").innerHTML=`<span class="err">Couldn't load data.json — the first automatic update may not have run yet.</span>`;
  });
</script>
</body>
</html>
